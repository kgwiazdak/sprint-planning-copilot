[tool.poetry]
name = "sprint-planning-transcription2jira-tasks"
version = "0.1.0"
description = "FastAPI backend that transcribes sprint planning meetings and extracts Jira-ready tasks."
authors = ["AI Scrum Co-Pilot <devnull@example.com>"]
readme = "README.md"
packages = [{ include = "backend" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "0.115.2"
uvicorn = "^0.41"
pydantic = "^2.12"
python-multipart = "0.0.9"
langchain = "^1.2.10"
langchain-openai = "^1.1.9"
langgraph = "^1.0.8"
openai = ">=1.52.0,<2.0.0"
azure-cognitiveservices-speech = ">=1.38,<2.0"
azure-identity = ">=1.17.0,<2.0.0"
azure-keyvault-secrets = ">=4.8.0,<5.0.0"
python-dotenv = ">=1.0,<2.0"
elevenlabs = "2.22.1"
azure-storage-blob = ">=12.24.0,<13.0.0"
azure-storage-queue = ">=12.12.0,<13.0.0"
azure-cosmos = "^4.8.0"
mlflow = ">=2.17.0,<3.0.0"
PyJWT = { version = ">=2.9.0,<3.0.0", extras = ["crypto"] }
llama-index-core = "^0.11.23"
llama-index-embeddings-openai = "^0.2.5"
llama-index-llms-openai = "^0.2.7"
llama-index-vector-stores-qdrant = "^0.3.0"
qdrant-client = "^1.12.1"
sqlalchemy = "^2.0.36"
mcp = "^1.26.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
