services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-ai-scrum-copilot-mvp}
      MCP_ATLASSIAN_SERVER_URL: ${MCP_ATLASSIAN_SERVER_URL:-http://mcp-atlassian:8111/mcp}
    depends_on:
      - mlflow
      - mcp-atlassian
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./data/mlflow:/mlflow
      - ./app.db:/app/app.db

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.2
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./data/mlflow:/mlflow

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_FRONTEND_API_URL:-/api}
        VITE_APP_PROFILE: ${APP_PROFILE:-prod}
        VITE_ATLASSIAN_CLIENT_ID: ${VITE_ATLASSIAN_CLIENT_ID:-}
        VITE_ATLASSIAN_REDIRECT_URI: ${VITE_ATLASSIAN_REDIRECT_URI:-}
        VITE_ATLASSIAN_SCOPES: ${VITE_ATLASSIAN_SCOPES:-}
    ports:
      - "4173:4173"
    depends_on:
      - api

  worker:
    build: .
    command: [ "python", "-m", "backend.worker" ]
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-ai-scrum-copilot-mvp}
      MCP_ATLASSIAN_SERVER_URL: ${MCP_ATLASSIAN_SERVER_URL:-http://mcp-atlassian:8111/mcp}
    depends_on:
      - api

  mcp-atlassian:
    build: .
    command: [ "python", "-m", "backend.infrastructure.mcp.atlassian_server" ]
    env_file:
      - .env
    environment:
      MCP_SERVER_TRANSPORT: streamable-http
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 8111
    ports:
      - "8111:8111"

  langgraph:
    build:
      context: .
      dockerfile: Dockerfile.langgraph
    command:
      - langgraph
      - dev
      - --config
      - langgraph.json
      - --host
      - 0.0.0.0
      - --port
      - "2024"
      - --no-browser
      - --tunnel
    env_file:
      - .env
    environment:
      MCP_ATLASSIAN_SERVER_URL: ${MCP_ATLASSIAN_SERVER_URL:-http://mcp-atlassian:8111/mcp}
    ports:
      - "2024:2024"
    depends_on:
      - api
